{% extends "base.html" %}
{% block content %}
<h2>Set up MFA</h2>
<div class="grid">
  <div class="panel good">
    <p>1. Scan this QR code with your authenticator app.</p>
    <img class="qr" src="data:image/png;base64,{{ qr }}" alt="TOTP QR code">
    <p class="muted">Can't scan? Enter this key manually: <code>{{ secret }}</code></p>
  </div>
  <form class="panel good" method="post">
    <p>2. Type the 6-digit code the app shows.</p>
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <input name="code" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="one-time-code" required>
    <button>Verify &amp; enable</button>
    <p class="muted">The secret is encrypted by the app before it is stored in the database.</p>
  </form>
</div>
{% endblock %}
