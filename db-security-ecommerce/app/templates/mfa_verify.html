{% extends "base.html" %}
{% block content %}
<h2>Second factor for {{ username }}</h2>
<form class="panel good narrow" method="post">
  <p>Your password was correct. Now enter the 6-digit code from your authenticator app.</p>
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <input name="code" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="one-time-code" autofocus required>
  <button>Verify</button>
</form>
{% endblock %}
